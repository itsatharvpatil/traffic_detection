# PASCAL VOC dataset http://host.robots.ox.ac.uk/pascal/VOC by University of Oxford
# Documentation: https://docs.ultralytics.com/datasets/detect/voc/
# Example usage: yolo train data=VOC_traffic.yaml

path: /content/datasets/VOC/images/VOCdevkit 
train:
  - /content/datasets/VOC/images/VOCdevkit/VOC2012/JPEGImages
  - /content/datasets/VOC/images/VOCdevkit/VOC2007/JPEGImages

val:
  - /content/datasets/VOC/images/VOCdevkit/VOC2007/JPEGImages

# Traffic classes only
names:
  0: bicycle
  1: bus
  2: car
  3: motorbike
  4: person
  5: train

# Download script/URL (optional) ---------------------------------------------------------------------------------------
download: |
  import xml.etree.ElementTree as ET
  from pathlib import Path
  import yaml

  from ultralytics.utils.downloads import download
  from ultralytics.utils import ASSETS_URL, TQDM

  # Map VOC original class indices to new traffic-only indices
  traffic_classes_map = {
      "bicycle": 0,
      "bus": 1,
      "car": 2,
      "motorbike": 3,
      "person": 4,
      "train": 5
  }

  def convert_label(path, lb_path, year, image_id):
      """Converts XML annotations from VOC format to YOLO format for traffic classes only."""
      def convert_box(size, box):
          dw, dh = 1.0 / size[0], 1.0 / size[1]
          x_center = (box[0] + box[1]) / 2.0 - 1
          y_center = (box[2] + box[3]) / 2.0 - 1
          width = box[1] - box[0]
          height = box[3] - box[2]
          return x_center * dw, y_center * dh, width * dw, height * dh

      xml_file = path / f"VOC{year}/Annotations/{image_id}.xml"
      with open(xml_file) as in_file, open(lb_path, "w", encoding="utf-8") as out_file:
          tree = ET.parse(in_file)
          root = tree.getroot()
          size = root.find("size")
          w = int(size.find("width").text)
          h = int(size.find("height").text)

          for obj in root.iter("object"):
              cls_name = obj.find("name").text
              difficult = int(obj.find("difficult").text)
              if cls_name in traffic_classes_map and difficult != 1:
                  xmlbox = obj.find("bndbox")
                  bb = convert_box(
                      (w, h),
                      [float(xmlbox.find(x).text) for x in ("xmin", "xmax", "ymin", "ymax")]
                  )
                  cls_id = traffic_classes_map[cls_name]
                  out_file.write(" ".join(str(a) for a in (cls_id, *bb)) + "\n")

  # Download VOC data
  dir = Path(yaml["path"])  # dataset root dir
  urls = [
      f"{ASSETS_URL}/VOCtrainval_06-Nov-2007.zip",  # 446MB, 5012 images
      f"{ASSETS_URL}/VOCtest_06-Nov-2007.zip",      # 438MB, 4953 images
      f"{ASSETS_URL}/VOCtrainval_11-May-2012.zip",  # 1.95GB, 17126 images
  ]
  download(urls, dir=dir / "images", threads=3, exist_ok=True)  # download and unzip

  # Convert annotations and move images
  voc_root = dir / "images/VOCdevkit"
  for year, image_set in ("2012", "train"), ("2012", "val"), ("2007", "train"), ("2007", "val"), ("2007", "test"):
      imgs_path = dir / "images" / f"{image_set}{year}"
      lbs_path = dir / "labels" / f"{image_set}{year}"
      imgs_path.mkdir(exist_ok=True, parents=True)
      lbs_path.mkdir(exist_ok=True, parents=True)

      with open(voc_root / f"VOC{year}/ImageSets/Main/{image_set}.txt") as f:
          image_ids = f.read().strip().split()

      for id in TQDM(image_ids, desc=f"{image_set}{year}"):
          old_img = voc_root / f"VOC{year}/JPEGImages/{id}.jpg"
          new_lb_path = (lbs_path / old_img.name).with_suffix(".txt")
          old_img.rename(imgs_path / old_img.name)  # move image
          convert_label(voc_root, new_lb_path, year, id)
